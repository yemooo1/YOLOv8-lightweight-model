# 阶段② 知识蒸馏 · 学生网络定义
# ------------------------------------------------------------
# 结构与 yolov8n（3.2M 参数）逐模块等价：
#   宽度 width=0.25 已展开为显式通道；深度 depth=0.33 已展开为显式 repeats
#   （C2f repeats：3→1、6→2，已在下面直接写死）
#   - 可直接加载 yolov8n.pt / 阶段① baseline best.pt 作为蒸馏初始化权重
#   - 显式写死通道/层数，避免不同 ultralytics 版本 scale 推断差异
#   - 阶段③ 结构重参数化时，只需把下面的 Conv 替换为 RepConv（推理时融合）
#
# 颈部送入 Detect 的三层特征通道：P3=64, P4=128, P5=256
# 教师 yolov8l 对应通道：           P3=256, P4=512, P5=512
# 因此蒸馏包装器会挂 3 个 1x1 对齐卷积：64→256 / 128→512 / 256→512
#
# 参数量预算：学生 3.16M + 对齐层 ~0.21M ≈ 3.37M（目标 <5M ✔）

nc: 80

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]]      # 1-P2/4
  - [-1, 1, C2f, [32, True]]       # 2  (depth 0.33: 3→1)
  - [-1, 1, Conv, [64, 3, 2]]      # 3-P3/8
  - [-1, 2, C2f, [64, True]]       # 4  (depth 0.33: 6→2)
  - [-1, 1, Conv, [128, 3, 2]]     # 5-P4/16
  - [-1, 2, C2f, [128, True]]      # 6  (depth 0.33: 6→2)
  - [-1, 1, Conv, [256, 3, 2]]     # 7-P5/32
  - [-1, 1, C2f, [256, True]]      # 8  (depth 0.33: 3→1)
  - [-1, 1, SPPF, [256, 5]]        # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 1, C2f, [128]]            # 12 (3→1)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 1, C2f, [64]]             # 15 (P3/8-small, 3→1)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]     # cat head P4
  - [-1, 1, C2f, [128]]            # 18 (P4/16-medium, 3→1)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]      # cat head P5
  - [-1, 1, C2f, [256]]            # 21 (P5/32-large, 3→1)

  - [[15, 18, 21], 1, Detect, [nc]] # 22 Detect(P3, P4, P5)
